# SCENARIO C -- a component that never completes.
#
# Previews `flaky-demo`, which does not exist, so everything shows as added. Two
# component DryRuns get raised: postgres (succeeds in ~30s) and broken (never does).
#
# Expected timeline:
#   ~30s    both component DryRuns appear; postgres reports Completed=True
#   ~30s+   `broken` pod enters CrashLoopBackOff and stays there
#   10 min  the compound gives up waiting, writes a PARTIAL summary and reports
#           Completed=True
#
# The 10 minutes is componentDryRunTimeout in internal/controller/dryrun_controller.go.
# Shorten it and rebuild if you want a faster loop.
#
# What to check in the partial summary:
#   - the compound's own diff renders normally (flaky-configmap.yaml and both
#     component request files, all added)
#   - the postgres component section renders a normal diff
#   - the broken component section says it did not complete, rather than being
#     silently missing
#
# And what to check AFTERWARDS, which is the more interesting part:
#   - the `broken` component DryRun still has an EMPTY status and is still requeueing
#   - its pod is still crash-looping
#   Nothing cleans either up until you delete this DryRun. The compound reports
#   success while an orphan spins behind it. That is the unfixed bug, now inherited
#   by every component.
apiVersion: platform.kratix.io/v1alpha1
kind: DryRun
metadata:
  name: failing-preview
  namespace: default
spec:
  promiseRef:
    name: flaky-app
  resourceRequestRef:
    name: flaky-demo
    namespace: default
  resource:
    tier: bronze
    dbVersion: "15"
    dbStorageGb: 10

# SCENARIO B -- UPDATE.
#
# Preview a change to the existing `demo-app`. Every field differs from
# 05-app-request.yaml, so all four documents and both components should show as
# modified:
#
#   compound's own workloads
#     app-configmap.yaml         tier bronze->gold, image 1.25->1.27
#     app-deployment.yaml        replicas 2->3, image 1.25->1.27
#   compound's component requests
#     postgres-request.yaml      version 15->16, storageGb 10->20
#     ingressroute-request.yaml  host demo->demo-v2, tls false->true
#
#   component: postgres / demo-app-db
#     postgres-statefulset.yaml  image postgres:15->16, storage 10Gi->20Gi
#   component: ingress / demo-app-ingress
#     ingress.yaml               host changed, tls block ADDED
#
# The component sections are the point of the whole feature: without them you would
# see only that the component *requests* changed, not that postgres would restate its
# StatefulSet with new storage, or that the Ingress would gain a TLS block.
apiVersion: platform.kratix.io/v1alpha1
kind: DryRun
metadata:
  name: update-preview
  namespace: default
spec:
  promiseRef:
    name: app
  resourceRequestRef:
    name: demo-app
    namespace: default
  resource:
    image: nginx:1.27
    replicas: 3
    tier: gold
    host: demo-v2.example.com
    tls: true
    dbVersion: "16"
    dbStorageGb: 20

# A compound Promise with ONE GOOD and ONE BROKEN component.
#
# The compound itself is fine -- its own pipeline succeeds. It emits three documents:
#   1. flaky-configmap.yaml    -- its own workload, succeeds
#   2. postgres-request.yaml   -- component request for `postgres`, succeeds
#   3. broken-request.yaml     -- component request for `broken`, never completes
#
# The point is to see what a PARTIAL summary looks like: the compound's own diff and
# the postgres component's diff should both render normally, while the broken component
# reports its state inline instead of a diff. That is the behaviour to check -- one bad
# component should not sink the whole preview.
apiVersion: platform.kratix.io/v1alpha1
kind: Promise
metadata:
  name: flaky-app
spec:
  destinationSelectors:
    - matchLabels:
        environment: dev
  api:
    apiVersion: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
    metadata:
      name: flakyapps.example.kratix.io
    spec:
      group: example.kratix.io
      names:
        kind: FlakyApp
        plural: flakyapps
        singular: flakyapp
      scope: Namespaced
      versions:
        - name: v1alpha1
          served: true
          storage: true
          schema:
            openAPIV3Schema:
              type: object
              properties:
                spec:
                  type: object
                  properties:
                    tier:
                      type: string
                    dbVersion:
                      type: string
                    dbStorageGb:
                      type: integer
  workflows:
    resource:
      configure:
        - apiVersion: platform.kratix.io/v1alpha1
          kind: Pipeline
          metadata:
            name: flaky-configure
          spec:
            containers:
              - name: render
                image: syntasso/test-bundle-image:v0.1.0
                command:
                  - sh
                  - -c
                  - |
                    set -e
                    name=$(yq '.metadata.name' /kratix/input/object.yaml)
                    ns=$(yq '.metadata.namespace' /kratix/input/object.yaml)
                    tier=$(yq '.spec.tier' /kratix/input/object.yaml)
                    db_version=$(yq '.spec.dbVersion' /kratix/input/object.yaml)
                    db_storage=$(yq '.spec.dbStorageGb' /kratix/input/object.yaml)

                    # ---------- the compound's own workload ----------

                    cat <<EOF > /kratix/output/flaky-configmap.yaml
                    apiVersion: v1
                    kind: ConfigMap
                    metadata:
                      name: ${name}-config
                      namespace: ${ns}
                    data:
                      tier: "${tier}"
                    EOF

                    # ---------- component that works ----------

                    cat <<EOF > /kratix/output/postgres-request.yaml
                    apiVersion: example.kratix.io/v1alpha1
                    kind: Postgres
                    metadata:
                      name: ${name}-db
                      namespace: ${ns}
                      labels:
                        kratix.io/parent-promise-name: flaky-app
                        kratix.io/parent-resource-name: ${name}
                        kratix.io/parent-resource-namespace: ${ns}
                    spec:
                      version: "${db_version}"
                      storageGb: ${db_storage}
                      replicas: 1
                    EOF

                    # ---------- component that always fails ----------

                    cat <<EOF > /kratix/output/broken-request.yaml
                    apiVersion: example.kratix.io/v1alpha1
                    kind: Broken
                    metadata:
                      name: ${name}-broken
                      namespace: ${ns}
                      labels:
                        kratix.io/parent-promise-name: flaky-app
                        kratix.io/parent-resource-name: ${name}
                        kratix.io/parent-resource-namespace: ${ns}
                    spec:
                      message: "raised by ${name}"
                    EOF

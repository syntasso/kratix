# SCENARIO A -- CREATE. Apply this BEFORE 05-app-request.yaml.
#
# Previews `demo-app` while it still does not exist. Nothing exists to diff against,
# so every file shows as *added* -- the compound Promise's two workloads, its two
# component requests, and both components' own output.
#
# The `resource` block below is IDENTICAL to the spec in 05-app-request.yaml. That is
# deliberate: this is a preview of exactly what you are about to apply, so after
# step 5 you can check that what the dry run predicted is what actually got created.
# It mirrors the real business process -- open a PR for a new app, preview it, merge.
#
# What this exercises: the App pipeline derives component request names from the
# parent's metadata.name. For a parent that does not exist yet, the reader presents the
# INTENDED name from resourceRequestRef rather than the ephemeral RR's generated one,
# so expect `demo-app-db` and `demo-app-ingress` -- not `kratix-dry-run-...`. This is
# the main pull-request case, and it was broken before this spike.
apiVersion: platform.kratix.io/v1alpha1
kind: DryRun
metadata:
  name: create-preview
  namespace: default
spec:
  promiseRef:
    name: app
  # Deliberately names a request that does not exist yet.
  resourceRequestRef:
    name: demo-app
    namespace: default
  resource:
    image: nginx:1.25
    replicas: 2
    tier: bronze
    host: demo.example.com
    tls: false
    dbVersion: "15"
    dbStorageGb: 10

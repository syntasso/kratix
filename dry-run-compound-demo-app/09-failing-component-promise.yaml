# Component Promise that ALWAYS FAILS, for testing dry-run failure handling.
#
# Its pipeline exits non-zero before writing anything to /kratix/output. Kubernetes
# retries the Job, so the pod crash-loops. Kratix reports
# ConfigureWorkflowCompleted=False with reason PipelinesInProgress, and -- importantly
# -- never sets WorksSucceeded at all, because no Works are ever created.
#
# That matters: the DryRunReconciler only marks a dry run failed on
# WorksSucceeded=False. An ABSENT condition is not False, so this exercises the
# timeout path rather than the failure path.
apiVersion: platform.kratix.io/v1alpha1
kind: Promise
metadata:
  name: broken
spec:
  destinationSelectors:
    - matchLabels:
        environment: dev
  api:
    apiVersion: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
    metadata:
      name: brokens.example.kratix.io
    spec:
      group: example.kratix.io
      names:
        kind: Broken
        plural: brokens
        singular: broken
      scope: Namespaced
      versions:
        - name: v1alpha1
          served: true
          storage: true
          schema:
            openAPIV3Schema:
              type: object
              properties:
                spec:
                  type: object
                  properties:
                    message:
                      type: string
  workflows:
    resource:
      configure:
        - apiVersion: platform.kratix.io/v1alpha1
          kind: Pipeline
          metadata:
            name: broken-configure
          spec:
            containers:
              - name: fail
                image: syntasso/test-bundle-image:v0.1.0
                command:
                  - sh
                  - -c
                  - |
                    message=$(yq '.spec.message' /kratix/input/object.yaml)
                    echo "broken-configure: failing on purpose -- ${message}"
                    echo "this Promise exists only to test dry-run failure handling"
                    exit 1

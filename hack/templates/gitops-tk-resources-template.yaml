---
apiVersion: source.toolkit.fluxcd.io/v1beta2
kind: Bucket
metadata:
  name: DESTINATION_NAME-workload-dependencies
  namespace: flux-system
spec:
  interval: 10s
  provider: generic
  bucketName: DESTINATION_NAME-kratix-dependencies
  endpoint: ENDPOINT
  insecure: true
  secretRef:
    name: bucket-credentials
---
apiVersion: source.toolkit.fluxcd.io/v1beta2
kind: Bucket
metadata:
  name: DESTINATION_NAME-workload-resources
  namespace: flux-system
spec:
  interval: 10s
  provider: generic
  bucketName: DESTINATION_NAME-kratix-resources
  endpoint: ENDPOINT
  insecure: true
  secretRef:
    name: bucket-credentials
---
apiVersion: v1
kind: Secret
metadata:
  name: bucket-credentials
  namespace: flux-system
type: Opaque
data:
  accesskey: a3JhdGl4YWRtaW4=
  secretkey: a3JhdGl4YWRtaW4=
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: DESTINATION_NAME-workload-resources
  namespace: flux-system
spec:
  interval: 3s
  prune: true
  dependsOn:
    - name: DESTINATION_NAME-workload-dependencies
  sourceRef:
    kind: Bucket
    name: DESTINATION_NAME-workload-resources
  path: PATH
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: DESTINATION_NAME-workload-dependencies
  namespace: flux-system
spec:
  interval: 8s
  prune: true
  sourceRef:
    kind: Bucket
    name: DESTINATION_NAME-workload-dependencies
  path: PATH

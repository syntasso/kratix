apiVersion: platform.kratix.io/v1alpha1
kind: Promise
metadata:
  # Short name: the generated pipeline ServiceAccount
  # "<promise>-resource-delete-resource-delete-retry-pipe" must fit in 60 chars.
  name: wf-retry-del
  labels:
    kratix.io/promise-version: retry-v1
spec:
  api:
    apiVersion: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
    metadata:
      name: workflowretrydels.test.kratix.io
    spec:
      group: test.kratix.io
      names:
        kind: WorkflowRetryDel
        plural: workflowretrydels
        singular: workflowretrydel
      scope: Namespaced
      versions:
        - name: v1alpha1
          served: true
          storage: true
          schema:
            openAPIV3Schema:
              type: object
              properties:
                spec:
                  type: object
  workflows:
    promise:
      delete:
        - apiVersion: platform.kratix.io/v1alpha1
          kind: Pipeline
          metadata:
            name: promise-delete-retry-pipe
          spec:
            rbac:
              permissions:
                - apiGroups: [ "" ]
                  resources: [ "configmaps" ]
                  verbs: [ "get" ]
            containers:
              - name: retry
                image: ghcr.io/syntasso/kratix-pipeline-utility:v0.0.1
                command: ["/bin/sh", "-c"]
                args:
                  - |
                    set -eu
                    if kubectl get configmap workflow-retry-del-promise-delete-gate -n kratix-platform-system >/dev/null 2>&1; then
                      echo "gate exists; promise delete can proceed"
                      exit 0
                    fi
                    cat <<'EOF' > /kratix/metadata/workflow-control.yaml
                    retryAfter: 10s
                    message: waiting for promise delete gate configmap
                    EOF
    resource:
      configure:
        - apiVersion: platform.kratix.io/v1alpha1
          kind: Pipeline
          metadata:
            name: resource-pipe-retry
          spec:
            containers:
              - name: complete
                image: ghcr.io/syntasso/kratix-pipeline-utility:v0.0.1
                command: ["/bin/sh", "-c"]
                args: ["echo 'configure complete'"]
      delete:
        - apiVersion: platform.kratix.io/v1alpha1
          kind: Pipeline
          metadata:
            name: resource-delete-retry-pipe
          spec:
            rbac:
              permissions:
                - apiGroups: [ "" ]
                  resources: [ "configmaps" ]
                  verbs: [ "get" ]
            containers:
              - name: retry
                image: ghcr.io/syntasso/kratix-pipeline-utility:v0.0.1
                command: ["/bin/sh", "-c"]
                args:
                  - |
                    set -eu
                    if kubectl get configmap workflow-retry-del-delete-gate -n default >/dev/null 2>&1; then
                      echo "gate exists; delete can proceed"
                      exit 0
                    fi
                    cat <<'EOF' > /kratix/metadata/workflow-control.yaml
                    retryAfter: 10s
                    message: waiting for delete gate configmap
                    EOF

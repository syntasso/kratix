apiVersion: platform.kratix.io/v1alpha1
kind: Promise
metadata:
  name: reconcilable
spec:
  api:
    apiVersion: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
    metadata:
      name: reconcilables.test.kratix.io
    spec:
      group: test.kratix.io
      names:
        kind: Reconcilable
        plural: reconcilables
        singular: reconcilable
      scope: Namespaced
      versions:
        - name: v1alpha1
          served: true
          storage: true
          schema:
            openAPIV3Schema:
              type: object
              properties:
                spec:
                  type: object
                  properties:
                    message:
                      type: string
  workflows:
    resource:
      configure:
        - apiVersion: platform.kratix.io/v1alpha1
          kind: Pipeline
          metadata:
            name: resource-configure
          spec:
            jobOptions:
              backoffLimit: 0
            rbac:
              permissions:
                - apiGroups: [""]
                  resources: ["configmaps"]
                  verbs: ["get"]
            containers:
              - name: gate
                image: ghcr.io/syntasso/kratix-pipeline-utility:v0.0.1
                command: ["/bin/sh", "-c"]
                args:
                  - |
                    set -u
                    if kubectl get configmap reconcile-after-failure-gate -n default >/dev/null 2>&1; then
                      echo "gate present; configure succeeds"
                      exit 0
                    fi
                    echo "gate absent; configure fails"
                    exit 1

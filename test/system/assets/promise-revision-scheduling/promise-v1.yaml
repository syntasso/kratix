apiVersion: platform.kratix.io/v1alpha1
kind: Promise
metadata:
  name: revisionscheduling
  labels:
    kratix.io/promise-version: v1.0.0
spec:
  destinationSelectors:
    - matchLabels:
        revision-scheduling: a
  api:
    apiVersion: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
    metadata:
      name: revisionschedulings.test.kratix.io
    spec:
      group: test.kratix.io
      names:
        kind: RevisionScheduling
        plural: revisionschedulings
        singular: revisionscheduling
      scope: Namespaced
      versions:
        - name: v1alpha1
          served: true
          storage: true
          schema:
            openAPIV3Schema:
              type: object
              x-kubernetes-preserve-unknown-fields: true
  workflows:
    resource:
      configure:
        - apiVersion: platform.kratix.io/v1alpha1
          kind: Pipeline
          metadata:
            name: instance
          spec:
            containers:
              - image: ghcr.io/syntasso/kratix-pipeline-utility:v0.0.1
                name: gen-configmap
                command: [sh]
                args:
                  - -c
                  - |
                    set -eux
                    name=$(yq '.metadata.name' /kratix/input/object.yaml)
                    kubectl create configmap "${name}" --namespace=default \
                      --from-literal=version=v1.0.0 \
                      --dry-run=client --output=yaml > /kratix/output/configmap.yaml

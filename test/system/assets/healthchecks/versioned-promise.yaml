apiVersion: platform.kratix.io/v1alpha1
kind: Promise
metadata:
  name: healthcheckversioned
  labels:
    kratix.io/promise-version: v2.0.0
spec:
  api:
    apiVersion: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
    metadata:
      creationTimestamp: null
      name: healthcheckversioned.test.kratix.io
    spec:
      group: test.kratix.io
      names:
        kind: Healthcheckversioned
        plural: healthcheckversioned
        singular: healthcheckversioned
      scope: Namespaced
      versions:
        - name: v1alpha1
          schema:
            openAPIV3Schema:
              properties:
                spec:
                  type: object
              type: object
          served: true
          storage: true
  workflows:
    resource:
      configure:
        - apiVersion: platform.kratix.io/v1alpha1
          kind: Pipeline
          metadata:
            name: instance-configure
          spec:
            containers:
              - name: write-output
                image: ghcr.io/syntasso/kratix-pipeline-utility:v0.0.1
                command: ["/bin/sh", "-c"]
                args:
                  - |
                    set -eu
                    cat <<'EOF' > /kratix/output/configmap.yaml
                    apiVersion: v1
                    kind: ConfigMap
                    metadata:
                      name: healthcheckversioned-config
                      namespace: default
                    data:
                      # comment the work-writer must keep
                      zeta: "true"
                      alpha: |
                        line one
                        line two
                    EOF
                    cat <<'EOF' > /kratix/output/healthdefinition.yaml
                    apiVersion: platform.kratix.io/v1alpha1
                    kind: HealthDefinition
                    metadata:
                      name: healthcheckversioned-example
                      namespace: default
                    spec:
                      promiseRef:
                        name: healthcheckversioned
                      resourceRef:
                        name: example
                        namespace: default
                      schedule: "* * * * *"
                      input: ""
                      workflow:
                        apiVersion: platform.kratix.io/v1alpha1
                        kind: Pipeline
                        metadata:
                          name: health
                        spec:
                          containers:
                            - name: health
                              image: ghcr.io/syntasso/kratix-pipeline-utility:v0.0.1
                    EOF

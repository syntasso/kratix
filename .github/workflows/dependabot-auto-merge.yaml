name: Dependabot Auto-merge

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
  # Re-run daily so github-actions PRs blocked by the age requirement get
  # picked up automatically once they are old enough.
  schedule:
    - cron: '0 9 * * *'

permissions:
  pull-requests: write
  # PR label add/remove goes through the Issues API even on a pull request.
  issues: write
  contents: write
  checks: read
  statuses: read

jobs:
  dependabot-auto-merge:
    uses: syntasso/ci/.github/workflows/dependabot-auto-merge.yaml@54c9d7551c85d2709c8613d0f0a7b441eb531e3c # main
    secrets:
      github_token: ${{ secrets.GITHUB_TOKEN }}
      gh_action_trigger_token: ${{ secrets.GH_ACTION_TRIGGER_TOKEN }}

apiVersion: v1
kind: Namespace
metadata:
  creationTimestamp: null
  name: seaweedfs
---
# The S3 endpoint. Deliberately named `bucket` rather than `seaweedfs`: the DNS name
# is the contract every downstream repo and doc hardcodes.
#
# nodePort 31337 is also a cross-repo contract: the kind extraPortMappings, the
# -destination Helm values (172.18.0.2:31337) and the gitops-tk-resources all
# depend on it.
apiVersion: v1
kind: Service
metadata:
  creationTimestamp: null
  name: bucket
  namespace: seaweedfs
spec:
  ports:
    - port: 80
      protocol: TCP
      targetPort: 8333
      nodePort: 31337
  selector:
    run: seaweedfs
  type: NodePort
---
# Secrets are namespaced, so the same credential ships twice: here for the server's
# env vars, and again in `default` for the BucketStateStore secretRef below.
apiVersion: v1
kind: Secret
metadata:
  name: bucket-credentials
  namespace: seaweedfs
stringData:
  accessKeyID: kratixadmin
  secretAccessKey: kratixadmin
---
apiVersion: apps/v1
kind: Deployment
metadata:
  creationTimestamp: null
  labels:
    run: seaweedfs
  name: seaweedfs
  namespace: seaweedfs
spec:
  replicas: 1
  selector:
    matchLabels:
      run: seaweedfs
  template:
    metadata:
      labels:
        run: seaweedfs
    spec:
      containers:
        - image: chrislusf/seaweedfs:4.41
          name: seaweedfs
          args:
            - server
            - -s3
            - -s3.port=8333
            - -dir=/data
            # -ip is the address this server advertises to its own components and
            # to clients the master redirects, so it must be routable from other
            # pods. The Pod IP is, and needs no Service port of its own.
            - -ip=$(POD_IP)
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: bucket-credentials
                  key: accessKeyID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: bucket-credentials
                  key: secretAccessKey
          ports:
            - containerPort: 8333
          # Readiness deliberately checks that the bucket exists, not just that the
          # port is open.
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - "echo 's3.bucket.list' | weed shell -master=localhost:9333 2>/dev/null | awk '{print $1}' | grep -qx kratix"
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          volumeMounts:
            - mountPath: /data
              name: data-volume
        # Bucket creation runs on EVERY pod start rather than once at install time.
        # The data volume is an emptyDir, so a pod replacement loses the bucket; this
        # loop puts it back. It also re-checks on an interval, so the bucket's
        # existence is a continuously enforced.
        - name: ensure-bucket
          image: chrislusf/seaweedfs:4.41
          command:
            - sh
            - -c
            - |
              set -u
              bucket_exists() {
                echo 's3.bucket.list' \
                  | weed shell -master=localhost:9333 2>/dev/null \
                  | awk '{print $1}' | grep -qx kratix
              }
              until echo 's3.bucket.list' | weed shell -master=localhost:9333 >/dev/null 2>&1; do
                echo "waiting for the seaweedfs master to answer..."
                sleep 2
              done
              while true; do
                if ! bucket_exists; then
                  echo "bucket 'kratix' is missing; creating it"
                  echo 's3.bucket.create --name kratix' | weed shell -master=localhost:9333
                  # weed shell can exit 0 without doing anything - and prints
                  # "created bucket kratix" even when the bucket was already there -
                  # so verify by listing rather than trusting the exit code or output.
                  if bucket_exists; then
                    echo "bucket 'kratix' created"
                  else
                    echo "ERROR: bucket 'kratix' still missing after create" >&2
                  fi
                fi
                # Recovery from a pod restart does not depend on this interval - the
                # first check runs immediately on container start. It only bounds
                # recovery from an out-of-band bucket deletion.
                sleep 10
              done
      volumes:
        - name: data-volume
          emptyDir: {}
---
apiVersion: v1
kind: Secret
metadata:
  name: bucket-credentials
  namespace: default
stringData:
  accessKeyID: kratixadmin
  secretAccessKey: kratixadmin
